name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Validate docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Mintlify CLI
        run: npm install -g mint

      - name: Validate the OpenAPI schema is parseable
        run: python3 -c "import json; s=json.load(open('api-reference/openapi.json')); print(len(s['paths']), 'paths')"

      # `broken-links` does not see a navigation entry pointing at a file that
      # does not exist -- there is no link to follow. That is how four dead
      # entries (guides/tools, guides/mcp, guides/skills, ecosystem/apowerb)
      # survived in docs.json and answered 404 on the live site. `validate`
      # runs the strict build and fails on them.
      - name: Validate the build
        run: mint validate

      - name: Check for broken links
        run: mint broken-links
